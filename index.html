      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;

      background-color: #f8fafc;
      border-color: #cbd5e1;

      color: white;

      padding: 14px;
      font-size: 1rem;
      font-weight: bold;

      color: #2563eb;

    let timeInSeconds = 3600; // 60 minutes
    let timerInterval;

    // Render questions to DOM
    function renderQuestions() {
      const container = document.getElementById("questionsContainer");
      questionsData.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = `${index + 1}. ${item.q}`;
        card.appendChild(title);

        const optionsGroup = document.createElement("div");
        optionsGroup.className = "options-group";

        item.options.forEach(opt => {
          const label = document.createElement("label");
          label.className = "option-label";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = `q_${index}`;
          radio.value = opt;

          label.appendChild(radio);
          label.appendChild(document.createTextNode(opt));
          optionsGroup.appendChild(label);
        });

        card.appendChild(optionsGroup);
        container.appendChild(card);
      });
    }

    // 60-Minute Countdown Timer
    function startTimer() {
      const timerElement = document.getElementById("timer");
      timerInterval = setInterval(() => {
        timeInSeconds--;

        let minutes = Math.floor(timeInSeconds / 60);
        let seconds = timeInSeconds % 60;

        let formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        timerElement.textContent = formattedTime;

        if (timeInSeconds <= 300) {
          timerElement.classList.add("warning");
        }

        if (timeInSeconds <= 0) {
          clearInterval(timerInterval);
          alert("Time has expired! Submitting your test automatically.");
          submitExam();
        }
      }, 1000);
    }

    // Submit and Evaluate Exam
    function submitExam() {
      clearInterval(timerInterval);

      let score = 0;
      questionsData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q_${index}"]:checked`);
        if (selected && selected.value === item.answer) {
          score++;
        }
      });

      document.getElementById("cbtForm").style.display = "none";
      const resultsCard = document.getElementById("resultsCard");
      resultsCard.style.display = "block";

      document.getElementById("scoreDisplay").textContent = `${score} / ${questionsData.length}`;
      let percentage = ((score / questionsData.length) * 100).toFixed(2);
      document.getElementById("percentageDisplay").textContent = `Percentage Score: ${percentage}%`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = () => {
      renderQuestions();
      startTimer();
    };
  </script>
